" width="37.625" height="35.7437" class="dg-f-surface2 dg-s-ink3" rx="4" stroke-width="1.5"/><text x="243.938" y="218.366" font-size="12.5" class="dg-f-ink dg-text" text-anchor="middle" font-weight="600">3</text><text x="12" y="71.25" font-size="12.5" class="dg-f-ink3 dg-text" font-weight="600">Q3</text><text x="225.125" y="71.25" font-size="12.5" class="dg-f-ink3 dg-text" font-weight="600">Q4</text><line x1="222.625" y1="60" x2="222.625" y2="118.244" stroke-width="2" class="dg-s-ink2" stroke-dasharray="4 3"/><text x="12" y="189.494" font-size="12.5" class="dg-f-ink3 dg-text" font-weight="600">Q4</text><path d="M56.6,117.0 V122.0 H175.5 V117.0" stroke-width="2" class="dg-f-none dg-s-nba"/><text x="116.062" y="136.994" font-size="12.5" class="dg-f-nba dg-text" text-anchor="middle" font-weight="600">kill 1</text><path d="M184.5,117.0 V122.0 H303.4 V117.0" stroke-width="2" class="dg-f-none dg-s-nba"/><text x="243.938" y="136.994" font-size="12.5" class="dg-f-nba dg-text" text-anchor="middle" font-weight="600">kill 2</text><text x="54.625" y="158.244" font-size="12.5" class="dg-f-ink dg-text" font-weight="600">6 straight stops = 2 kills</text><text x="54.625" y="174.494" font-size="12.5" class="dg-f-ink2 dg-text">across the break (4 + 2; 1 if it reset)</text><path d="M14.0,235.2 V240.2 H132.9 V235.2" stroke-width="2" class="dg-f-none dg-s-nba"/><text x="73.4375" y="255.238" font-size="12.5" class="dg-f-nba dg-text" text-anchor="middle" font-weight="600">kill</text><text x="180" y="255.238" font-size="12.5" class="dg-f-ink3 dg-text" text-anchor="middle">no kill</text><text x="12" y="276.488" font-size="12.5" class="dg-f-ink dg-text" font-weight="600">5 straight stops = 1 kill</text><text x="12" y="292.738" font-size="12.5" class="dg-f-ink2 dg-text">the last 2 start nothing</text><rect x="12" y="304.613" width="12.5" height="12.5" class="dg-f-nba" rx="3"/><text x="29.5" y="315.238" font-size="12.5" class="dg-f-ink2 dg-text">stop</text><rect x="74.5" y="304.613" width="12.